[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aftermath"
version = "0.1.0"
description = "From Agent Incident to Verified Immunity — forensic replay for agentic AI failures"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
gemini = [
    "google-genai>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["aftermath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-provider tests are excluded by default: the suite must run offline and
# deterministically. Opt in with `pytest -m live`.
addopts = "-m 'not live' --strict-markers"
markers = [
    "slow: takes more than a second",
    "live: requires a real LLM provider and network access",
    "replay: exercises the deterministic replay engine",
    "benchmark: exercises the benchmark harness",
    "security: security property test",
]

[tool.ruff]
line-length = 100
target-version = "py312"
